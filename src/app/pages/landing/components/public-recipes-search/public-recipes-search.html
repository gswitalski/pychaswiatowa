<div class="public-search-wrapper">
    <!-- Search Form Container (limited width) -->
    <div class="search-form-container">
        <form class="search-form" (ngSubmit)="onSearchSubmit(); $event.preventDefault()">
            <mat-form-field appearance="outline" class="search-field">
                <mat-label>{{ placeholder() }}</mat-label>
                <input
                    matInput
                    [formControl]="queryControl"
                    (input)="onInputChange()"
                    (keydown.enter)="onSearchSubmit(); $event.preventDefault()"
                    type="text"
                    autocomplete="off"
                    aria-label="Pole wyszukiwania przepisów"
                />
                <mat-icon matPrefix>search</mat-icon>
                
                @if (shortQueryHintVisible()) {
                    <mat-hint id="public-search-short-hint">
                        Wpisz co najmniej 3 znaki — wyszukiwanie uruchomi się automatycznie
                    </mat-hint>
                }
            </mat-form-field>

            @if (showResults()) {
                <button
                    mat-raised-button
                    color="primary"
                    type="button"
                    class="search-button"
                    (click)="onSearchSubmit()"
                    [disabled]="loadingInitial()"
                    aria-label="Szukaj przepisów"
                >
                    @if (loadingInitial()) {
                        <mat-spinner diameter="20"></mat-spinner>
                    } @else {
                        Szukaj
                    }
                </button>
            }
        </form>
        @if (!showResults()) {
            <div class="visually-hidden" aria-live="polite" role="status">
                {{ searchStatusMessage() }}
            </div>
        }
    </div>

    <!-- Results Section (full width, only if showResults is true) -->
    @if (showResults()) {
        <pych-public-recipe-results
            [items]="items()"
            [mode]="mode()"
            [context]="context()"
            [loadingInitial]="loadingInitial()"
            [loadingMore]="loadingMore()"
            [hasMore]="pageInfo().hasMore"
            [errorMessage]="errorMessage()"
            (loadMore)="onLoadMore()"
            (retry)="onRetry()"
        />
    }
</div>
