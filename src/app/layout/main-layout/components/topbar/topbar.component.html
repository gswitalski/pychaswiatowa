<mat-toolbar class="topbar">
    <div class="topbar__left">
        @if (isMobile() && shouldShowSidebar()) {
            <button
                mat-icon-button
                aria-label="Toggle menu"
                (click)="toggleSidebar()"
                class="topbar__menu-btn"
            >
                <mat-icon>menu</mat-icon>
            </button>
        }

        <a routerLink="/" class="topbar__logo-link" aria-label="Przejdź do strony głównej">
            <img class="topbar__logo-image" src="/logo-small.png" alt="Logo PychaŚwiatowa" />
            <span class="topbar__logo-text">PychaŚwiatowa</span>
        </a>
    </div>

    @if (!isMobileOrTablet()) {
        <div class="topbar__center">
            <pych-main-navigation class="topbar__main-navigation" [items]="mainNavItems()" />
        </div>
    }

    @if (false) {
        <div class="topbar__search-container">
            <pych-omnibox class="topbar__search" />
        </div>
    }

    <div class="topbar__right">
        @if (shouldShowPricingLink()) {
            <a
                mat-button
                routerLink="/pricing"
                class="topbar__pricing-link"
                aria-label="Przejdź do cennika"
            >
                Cennik
            </a>
        }
        <button
            mat-icon-button
            type="button"
            [matMenuTriggerFor]="userMenu"
            class="topbar__avatar topbar__user-button"
            [class.topbar__user-button--named]="displayName() !== null"
            [attr.aria-label]="userGreeting() ?? 'Menu użytkownika'"
            [matTooltip]="userGreeting() ?? ''"
            [matTooltipDisabled]="displayName() === null"
            #userTooltip="matTooltip"
            (menuOpened)="userTooltip.hide(0)"
        >
            @if (displayName(); as name) {
                <span class="topbar__username" aria-hidden="true">{{ name }}</span>
            }
            <mat-icon aria-hidden="true">account_circle</mat-icon>
        </button>

        <mat-menu #userMenu="matMenu" xPosition="before">
            @if (displayName(); as name) {
                <div class="topbar__menu-header" role="presentation">
                    Zalogowano jako <span class="topbar__menu-username">{{ name }}</span>
                </div>
                <mat-divider></mat-divider>
            }
            <a mat-menu-item routerLink="/settings">
                <mat-icon>settings</mat-icon>
                <span>Ustawienia</span>
            </a>
            @if (isAdmin()) {
                <a mat-menu-item routerLink="/admin/dashboard">
                    <mat-icon>admin_panel_settings</mat-icon>
                    <span>Admin</span>
                </a>
            }
            <button mat-menu-item (click)="logout()">
                <mat-icon>logout</mat-icon>
                <span>Wyloguj się</span>
            </button>
        </mat-menu>
    </div>
</mat-toolbar>
